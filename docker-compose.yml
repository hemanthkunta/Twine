services:
  aether-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-production-secret-must-be-provided-via-env-file-or-secrets}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - DB_PATH=/app/data/messaging.db
    volumes:
      - aether_data:/app/data
      - aether_uploads:/app/uploads
    restart: unless-stopped

volumes:
  aether_data:
  aether_uploads:
